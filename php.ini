; Local development PHP configuration for Kanboard
; Usage: php -S localhost:8000 -t . -c php.ini

; Upload settings
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; Memory settings (increased for large file uploads)
memory_limit = 512M

; Execution time (increased for large file processing)
max_execution_time = 600
max_input_time = 600

; Error reporting (development)
display_errors = On
error_reporting = E_ALL
log_errors = On

; Timezone
date.timezone = UTC
