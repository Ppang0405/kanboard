; Kanboard native Linux Swoole runtime configuration (experimental).
; Installed as $PHP_INI_DIR/conf.d/kanboard-swoole.ini by Dockerfile.swoole.
; Parity with the root php.ini upload/memory limits; UTC baseline.

date.timezone = UTC
expose_php = Off

; Errors go to the container log (STDERR), never to stdout: stdout output
; would permanently mark PHP headers as sent for the whole worker.
display_errors = Off
log_errors = On

; Upload settings (parity with root php.ini)
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; Memory settings (parity with root php.ini)
memory_limit = 512M

; OPcache for the long-running worker (CLI SAPI needs explicit opt-in)
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

; Session defaults mirror SessionManager::configure(); per-request
; cookie parameters are applied by the session adapter (later stage).
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; Swoole runs one synchronous worker; coroutines stay OFF.
swoole.enable_coroutine = Off
