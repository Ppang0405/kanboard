; PHP configuration for Kanboard on FrankenPHP
; Place in /usr/local/etc/php/conf.d/99-kanboard.ini

[PHP]
; Error handling
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Timezone
date.timezone = ${TZ:-UTC}

; File uploads
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; Memory and execution
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; Sessions - use PHP file sessions (not database) to avoid SQLite locking
session.gc_divisor = 100
session.gc_probability = 15
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1

[opcache]
; OPcache for better performance
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.save_comments = 1

; JIT compilation (PHP 8.0+)
opcache.jit_buffer_size = 100M
opcache.jit = tracing
