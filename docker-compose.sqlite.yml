# Docker Compose file to run Kanboard with SQLite
# Builds from source (Dockerfile) for Coolify deployment
# More information at https://docs.kanboard.org/v1/admin/docker/
name: kanboard
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
    volumes:
      - data:/var/www/app/data
      - plugins:/var/www/app/plugins
      - certs:/etc/nginx/ssl
    environment:
      - TZ=UTC
volumes:
  data:
    driver: local
  plugins:
    driver: local
  certs:
    driver: local
